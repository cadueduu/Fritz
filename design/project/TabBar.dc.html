<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;left:0;right:0;bottom:0;height:90px;background:var(--bar);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 6px 0;font-family:Figtree, sans-serif">
<button onClick="{{ goHoje }}" aria-label="Hoje" style="height:56px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:{{ c.hoje }};font:600 11px Figtree, sans-serif"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="2.2"></circle><circle cx="12" cy="12" r="3" fill="currentColor"></circle></svg>Hoje</button>
<button onClick="{{ goDiario }}" aria-label="Diário" style="height:56px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:{{ c.diario }};font:600 11px Figtree, sans-serif"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="2.4" rx="1.2" fill="currentColor"></rect><rect x="4" y="10.8" width="16" height="2.4" rx="1.2" fill="currentColor"></rect><rect x="4" y="16.6" width="10" height="2.4" rx="1.2" fill="currentColor"></rect></svg>Diário</button>
<div style="display:flex;justify-content:center"><button onClick="{{ goAdd }}" aria-label="Registrar refeição" style="width:62px;height:62px;margin-top:-22px;border-radius:22px;border:0;background:var(--pri);color:var(--onPri);box-shadow:0 12px 24px -10px var(--pri);display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 26 26"><rect x="11.6" y="4" width="2.8" height="18" rx="1.4" fill="currentColor"></rect><rect x="4" y="11.6" width="18" height="2.8" rx="1.4" fill="currentColor"></rect></svg></button></div>
<button onClick="{{ goProgresso }}" aria-label="Progresso" style="height:56px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:{{ c.progresso }};font:600 11px Figtree, sans-serif"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="4" y="12" width="3.6" height="8" rx="1.4" fill="currentColor"></rect><rect x="10.2" y="7" width="3.6" height="13" rx="1.4" fill="currentColor"></rect><rect x="16.4" y="4" width="3.6" height="16" rx="1.4" fill="currentColor"></rect></svg>Progresso</button>
<button onClick="{{ goAgente }}" aria-label="Agente" style="height:56px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:{{ c.agente }};font:600 11px Figtree, sans-serif"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4.5" width="17" height="12.5" rx="5" stroke="currentColor" stroke-width="2.2"></rect><circle cx="8" cy="19.5" r="1.6" fill="currentColor"></circle></svg>Agente</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;hoje&quot;,&quot;diario&quot;,&quot;progresso&quot;,&quot;agente&quot;],&quot;default&quot;:&quot;hoje&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onNav&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'hoje';
    const go = id => () => this.props.onNav && this.props.onNav(id);
    const c = {};
    ['hoje','diario','progresso','agente'].forEach(k => c[k] = a === k ? 'var(--pri)' : 'var(--ink2)');
    return { c, goHoje: go('hoje'), goDiario: go('diario'), goAdd: go('registrar'), goProgresso: go('progresso'), goAgente: go('agente') };
  }
}
</script>
</body>
</html>
